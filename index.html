<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Line Angle & Length Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f4f4f4;
    }
    input {
      width: 80px;
      margin: 0.25rem;
    }
    button {
      margin-top: 1rem;
    }
    .output {
      margin-top: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>2D Line Calculator</h2>

  <label>Point A (x₁, y₁):</label><br />
  <input type="number" id="x1" value="0.825" step="any"> 
  <input type="number" id="y1" value="12.7" step="any"><br />

  <label>Point B (x₂, y₂):</label><br />
  <input type="number" id="x2" value="1.925" step="any"> 
  <input type="number" id="y2" value="12.55" step="any"><br />

  <button onclick="calculate()">Calculate</button>

  <div class="output" id="result"></div>

  <script>
    function calculate() {
      const x1 = parseFloat(document.getElementById('x1').value);
      const y1 = parseFloat(document.getElementById('y1').value);
      const x2 = parseFloat(document.getElementById('x2').value);
      const y2 = parseFloat(document.getElementById('y2').value);

      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angleRad = Math.atan2(dy, dx);
      const angleDeg = angleRad * (180 / Math.PI);

      document.getElementById('result').innerHTML = 
        `Length: ${length.toFixed(4)} units<br />
         Angle: ${angleDeg.toFixed(2)}°`;
    }
  </script>
</body>
</html>
